# The control that suppresses dependency lifecycle scripts (preinstall,
# install, postinstall) for every workspace. The LavaMoat allow-scripts
# inventory in the root package.json records which packages declare such
# scripts and that none is allowed, but it is an inventory, not the switch:
# with this line in place, no install script runs whatever the inventory says.
enableScripts: false

enableTelemetry: 0

# Yarn reports each suppressed lifecycle script as a YN0004 warning
# ("disabled build scripts"). Those lines used to be discarded, which kept the
# install log short but also hid the one signal that a new dependency had
# started declaring an install script. They are now shown, so a new entry in
# that list is visible in every install and CI log and is the cue to add the
# package to the allow-scripts inventory.

nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: '@yarnpkg/plugin-workspace-tools'
  - path: .yarn/plugins/@yarnpkg/plugin-allow-scripts.cjs
    spec: 'https://raw.githubusercontent.com/LavaMoat/LavaMoat/main/packages/yarn-plugin-allow-scripts/bundles/@yarnpkg/plugin-allow-scripts.js'

yarnPath: .yarn/releases/yarn-3.2.1.cjs
