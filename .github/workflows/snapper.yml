name: Snapper security scan

# Manual only. Builds Snapper from source (its published npm package and its
# Docker image are both currently broken) and scans packages/snap.
on:
  workflow_dispatch:

# Least privilege: both jobs only read and upload an artifact.
permissions:
  contents: read

jobs:
  # Building the scanner is deliberately a separate job from running it.
  #
  # `npm ci` executes install lifecycle scripts from a third-party dependency
  # tree. This repository locks its own installs down (`enableScripts: false`
  # in .yarnrc.yml is the control that suppresses them; the LavaMoat
  # allow-scripts inventory in the root package.json is the reviewed record of
  # which packages declare such scripts, each set to `false`), and that
  # posture should not lapse just because the code being installed is a
  # security scanner. Isolating the build means those scripts run in a job
  # that has never checked out this repository, so there is no audited source
  # tree to tamper with and no credential on disk to find:
  # `persist-credentials: false` keeps the checkout token out of
  # `.git/config`, which is where an install script would otherwise look for
  # it.
  #
  # The scanner is shipped to the next job as a tarball including its
  # `node_modules`, because `dist/main.js` needs them at runtime. Tarring
  # first is what keeps the upload fast; uploading the tree file by file
  # would be far slower than the build itself.
  build-scanner:
    name: Build Snapper (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Snapper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: sayfer-io/Snapper
          # Pinned to Snapper main as of 2026-08-12. Bump this SHA deliberately
          # (review upstream changes first) rather than tracking a moving branch.
          ref: 66ea3158b89039cfa2453c5021aa965985c9135c
          path: .snapper-src
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Build Snapper from source
        working-directory: .snapper-src
        run: |
          npm ci
          npm run build

      - name: Package the built scanner
        run: tar -czf snapper-dist.tar.gz .snapper-src

      - name: Upload the built scanner
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: snapper-dist
          path: snapper-dist.tar.gz
          retention-days: 1

  snapper:
    name: Scan packages/snap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-scanner
    steps:
      - name: Checkout this repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Download the built scanner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapper-dist

      - name: Unpack the built scanner
        run: tar -xzf snapper-dist.tar.gz

      - name: Run Snapper against packages/snap
        # Snapper logs via winston; merge stderr into the captured stream so
        # findings are never lost. A scanner failure fails the job; the report
        # upload below still runs via `if: always()`.
        run: |
          mkdir -p snapper-report
          status=0
          node .snapper-src/dist/main.js \
            --path "${{ github.workspace }}/packages/snap" --verbose \
            > snapper-report/output.txt 2>&1 || status=$?
          echo "--- output.txt (first 300 lines) ---"
          head -n 300 snapper-report/output.txt || true
          exit "$status"

      - name: Collect any generated report files
        if: always()
        run: |
          find . -maxdepth 4 \( -name '*.html' -o -name 'snapper*.json' \) \
            -not -path './snapper-report/*' -not -path './.snapper-src/node_modules/*' \
            -exec cp {} snapper-report/ \; 2>/dev/null || true
          ls -la snapper-report || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: snapper-report
          path: snapper-report/
          if-no-files-found: warn
