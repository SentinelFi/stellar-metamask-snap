name: Snapper security scan

# Manual only — Snapper is a heavy Docker build; run it on demand
# (e.g. on the frozen pre-publish commit), not on every push.
on:
  workflow_dispatch:

jobs:
  snapper:
    name: Scan packages/snap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Snapper
        uses: actions/checkout@v4
        with:
          repository: sayfer-io/Snapper
          path: .snapper-src

      - name: Build Snapper image
        run: docker build -t snapper .snapper-src

      - name: Prepare output directory
        run: mkdir -p snapper-report

      - name: Run Snapper against packages/snap
        # Mount the snap package read-only and an output dir read-write.
        # Capture stdout too, so there is always something to inspect even if
        # the report flags differ across Snapper versions.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packages/snap:/snap:ro" \
            -v "${{ github.workspace }}/snapper-report:/out" \
            snapper --path /snap --htmlReport --logFile /out/snapper.log \
            | tee snapper-report/stdout.txt
        continue-on-error: true

      - name: Collect any generated report files
        if: always()
        run: |
          find packages/snap -maxdepth 2 -name '*.html' -exec cp {} snapper-report/ \; 2>/dev/null || true
          ls -la snapper-report || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapper-report
          path: snapper-report/
          if-no-files-found: warn
