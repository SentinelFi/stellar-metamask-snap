name: Snapper security scan

# Manual only. Builds Snapper from source (its published npm package and its
# Docker image are both currently broken) and scans packages/snap.
on:
  workflow_dispatch:

jobs:
  snapper:
    name: Scan packages/snap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout Snapper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: sayfer-io/Snapper
          # Pinned to Snapper main as of 2026-08-12. Bump this SHA deliberately
          # (review upstream changes first) rather than tracking a moving branch.
          ref: 66ea3158b89039cfa2453c5021aa965985c9135c
          path: .snapper-src

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Build Snapper from source
        working-directory: .snapper-src
        run: |
          npm ci
          npm run build

      - name: Run Snapper against packages/snap
        # Snapper logs via winston; merge stderr into the captured stream so
        # findings are never lost. A scanner failure fails the job; the report
        # upload below still runs via `if: always()`.
        run: |
          mkdir -p snapper-report
          status=0
          node .snapper-src/dist/main.js \
            --path "${{ github.workspace }}/packages/snap" --verbose \
            > snapper-report/output.txt 2>&1 || status=$?
          echo "--- output.txt (first 300 lines) ---"
          head -n 300 snapper-report/output.txt || true
          exit "$status"

      - name: Collect any generated report files
        if: always()
        run: |
          find . -maxdepth 4 \( -name '*.html' -o -name 'snapper*.json' \) \
            -not -path './snapper-report/*' -not -path './.snapper-src/node_modules/*' \
            -exec cp {} snapper-report/ \; 2>/dev/null || true
          ls -la snapper-report || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: snapper-report
          path: snapper-report/
          if-no-files-found: warn
