name: Docs

# Publishes the documentation site to GitHub Pages.
#
# The site is rendered from the repository's own markdown (see
# scripts/build-docs.mjs), so this workflow never becomes a second place where
# the documentation lives: it is a renderer, not a copy. A page that is wrong
# here is wrong in the tree, and is fixed there.
#
# CI builds the same site on every pull request, which is what catches a
# broken build or a connector method missing from the API reference before it
# reaches main. This workflow only adds deployment.
#
# Deployment is manual for now, deliberately. GitHub Pages cannot publish from
# a private repository on the Free plan, so an automatic push trigger would
# fail on every commit to main and train reviewers to ignore a red X. It also
# means nothing is published by accident: a Pages site is public even when its
# repository is not, so going live should be a decision someone makes, not a
# side effect of merging.
#
# To publish: enable Pages (Settings -> Pages -> Source: GitHub Actions), run
# this workflow once from the Actions tab, then restore the automatic trigger
# by adding `push: branches: [main]` below.
on:
  workflow_dispatch:

# Read-only by default. The Pages write and `id-token` permissions live on
# the deploy job alone: the build job is the one that runs third-party code
# (the whole install and build chain), and it must not inherit a token that
# can mint the OIDC deployment credential or touch Pages.
permissions:
  contents: read

# One deployment at a time, and never cancel one mid-flight: a cancelled
# deploy can leave the site serving a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The build runs third-party code; the job token has nothing to do
          # after checkout and must not linger in .git/config for it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build documentation site
        run: yarn build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that needs more than repository read: `pages` for the
    # Pages configuration and deployment, `id-token` for the short-lived
    # OIDC deployment credential. It runs no third-party build code and
    # never checks out the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
