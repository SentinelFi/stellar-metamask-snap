name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (eslint + prettier)
        run: yarn lint

      - name: Build snap (includes SES eval)
        run: yarn workspace stellar-soroban-snap build

      - name: Verify committed manifest matches the built bundle
        run: git diff --exit-code packages/snap/snap.manifest.json

      - name: Build connector
        run: yarn workspace stellar-soroban-snap-connector build

      - name: Snap tests
        run: yarn workspace stellar-soroban-snap test

      - name: Connector tests
        run: yarn workspace stellar-soroban-snap-connector test

  site:
    name: Build companion dapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build connector (site dependency)
        run: yarn workspace stellar-soroban-snap-connector build

      - name: Build site
        run: yarn workspace site build
