name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow: every job here lints, builds, tests,
# and uploads an artifact. None writes to the repository, so none needs a
# token that can. Declared explicitly rather than left to the repository
# default, which is read-write on repositories created before the default
# changed and can be widened again at the organization level without any
# change landing here.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # These jobs run third-party build and test code; the job token has
          # nothing to do after checkout and must not linger in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (eslint + prettier)
        run: yarn lint

      # The release version lives in four files, one of them a hardcoded
      # constant that pins which snap version dapps install. A bump that
      # misses one is silent and version-pinned allowlisting would ship it.
      - name: Verify release versions agree
        run: yarn check:versions

      - name: Build snap (includes SES eval)
        run: yarn workspace stellar-soroban-snap build

      - name: Verify committed manifest matches the built bundle
        run: git diff --exit-code packages/snap/snap.manifest.json

      # The threat model claims the shipped bundle contains zero Math.random
      # references (snap.config.ts rewrites them to crypto.getRandomValues).
      # Enforce the claim so a dependency bump reintroducing insecure
      # randomness in a form the rewrite misses fails the build.
      #
      # The rewrite itself additionally asserts how many references it
      # replaced and fails the build when that number moves; this step prints
      # the resulting counts so the numbers are visible in the CI log without
      # the build tooling carrying a console call. Counts are reported, not
      # asserted: `getRandomValues` also comes from @noble and key-tree doing
      # legitimate crypto, so an exact expectation here would be brittle
      # rather than meaningful. The exact assertion lives in snap.config.ts,
      # where it can count only its own replacements.
      - name: Verify bundle contains no insecure randomness
        run: |
          BUNDLE=packages/snap/dist/bundle.js
          ! grep -qE 'Math\.random|Math\[.random' "$BUNDLE"
          echo "Math.random references:      $(grep -o 'Math\.random' "$BUNDLE" | wc -l)"
          echo "crypto.getRandomValues uses: $(grep -o 'getRandomValues' "$BUNDLE" | wc -l)"

      # DIRECT runtime dependencies must stay advisory-free, in every
      # workspace: the snap is the signing surface, but the connector is the
      # dapp-facing trust boundary and the site is deployed, so none of them
      # gets to ship a known advisory.
      #
      # Note the word "direct". Yarn Berry audits only the direct dependencies
      # of the selected workspaces unless `--recursive` is passed, so this step
      # says nothing about the transitive graph, which is where every
      # production advisory this project has ever had actually lives. The step
      # below is what covers that; this one is not a substitute for it.
      - name: Audit direct runtime dependencies (all workspaces)
        run: yarn npm audit --all --environment production

      # The snap's TRANSITIVE production graph, audited per exact version.
      #
      # This is the check the step above cannot perform, and it is also the
      # check the step below cannot be trusted to perform on its own. The
      # vendored Yarn 3 builds its audit map keyed by package NAME across every
      # workspace, so when the snap and the site resolve different versions of
      # the same package (they do: axios 1.18.0 through the stellar SDK versus
      # axios 1.12.1 through gatsby), one version wins and is reported as if it
      # were the snap's. That over-reports today and would under-report the
      # moment the roles reverse. The script instead asks Yarn for the snap
      # workspace's own resolution (`yarn info --recursive --virtuals`), walks
      # only the production edges from the manifest's `dependencies`, posts the
      # exact `{ name: [versions] }` closure to the npm bulk advisory endpoint,
      # and fails on any advisory in a module that audits/known-advisories.json
      # has not dispositioned. It first proves the endpoint still answers with
      # advisories for a known-vulnerable version, so an empty answer cannot
      # pass by accident. The audited closure is printed so the run log records
      # exactly what was checked.
      - name: Audit the snap's exact production graph
        run: node scripts/check-snap-graph-advisories.mjs

      # The same graph as Yarn's own audit reports it, gated against the
      # reviewed allowlist (audits/known-advisories.json).
      #
      # Kept alongside the step above for what it verifies that the step above
      # does not: the claim the allowlist rests on. It greps the built bundle
      # for string markers from each package the allowlist says is absent, so
      # "webpack tree-shakes it out" stops being prose in the threat model and
      # becomes something CI re-derives on every run. It therefore has to come
      # after the build. Because of the name-keyed audit described above, the
      # versions Yarn reports here may be another workspace's, which is why the
      # allowlist is keyed by module rather than by version or advisory.
      #
      # `|| true` catches the audit's non-zero exit when advisories exist; the
      # script does the actual judging. An audit that failed to run leaves an
      # unparseable report, or one without the fields a Yarn report always
      # carries, which the script treats as a failure rather than as a clean
      # result.
      - name: Gate transitive production advisories against the allowlist
        run: |
          ( cd packages/snap && \
            yarn npm audit --environment production --recursive --json ) \
            > "$RUNNER_TEMP/audit.json" || true
          node scripts/check-known-advisories.mjs "$RUNNER_TEMP/audit.json"

      # The gate above covers what ships. This step covers what *builds* it,
      # which nothing surfaced before: a compromised or vulnerable build
      # dependency reaches the deployed dapp, and for the snap it would reach
      # the bundle the shasum then seals. Reporting rather than gating is
      # deliberate. The Gatsby toolchain carries advisories that only upstream
      # can clear, so failing on them would leave the build permanently red and
      # train reviewers to ignore it, which is worse than not checking. The
      # point is that the list is visible in every run and Dependabot has a
      # signal to act on. Advisories that CAN be cleared are pinned in the root
      # package.json "resolutions" instead.
      - name: Report build-chain advisories (non-blocking)
        run: yarn npm audit --all --recursive || true

      - name: Build connector
        run: yarn workspace stellar-soroban-snap-connector build

      # The root tsconfig turns on `strict`, `noUncheckedIndexedAccess`, and
      # `exactOptionalPropertyTypes`, but nothing in this workflow used to run
      # the compiler over the snap or the site: `mm-snap build` transpiles
      # through SWC and `gatsby build` through Babel, and typed linting reports
      # lint rules rather than type errors. Only the connector was type-checked,
      # as a side effect of building with tsc, so a type error in the signing
      # surface could land green. This step is what makes those compiler options
      # a gate rather than documentation.
      #
      # It runs *after* the connector build, not next to the lint step, because
      # the site imports the connector as a workspace package and resolves its
      # types from `dist/`. Type-checking the site against a stale or absent
      # connector build would report errors that say nothing about this commit.
      - name: Typecheck (all workspaces)
        run: yarn typecheck

      # Run with coverage so the per-module thresholds in jest.config.js gate
      # the build. They exist because the fail-closed signing guards are each
      # a single `if` whose deletion is invisible in review; the threshold on
      # handlers/sign.tsx is what turns that into a failing test.
      - name: Snap tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap test:coverage

      # Coverage-gated for the same reason as the snap: the connector is the
      # audited trust boundary between dapps and the snap, and its thresholds
      # live in packages/connector/jest.config.cjs.
      - name: Connector tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap-connector test:coverage

      # The docs site is rendered from the repository's markdown, and the
      # renderer additionally asserts that every public method of the
      # connector's client appears in docs/CONNECTOR-API.md. Running it here
      # means a method added without a documentation entry fails on the pull
      # request, rather than publishing a reference that quietly describes a
      # smaller API than the one that ships. The deploy workflow only runs on
      # main, so without this step nothing would check it beforehand.
      - name: Build documentation site
        run: yarn build:docs

      # SBOM for the release attestation trail (docs/RELEASE.md retains it
      # with the tag). Generated on every run so the artifact of a release
      # build is always present. syft reads yarn.lock directly, so it works
      # with the repo's pinned Yarn 3 (the CycloneDX yarn plugin requires
      # Yarn 4). The action uploads the SBOM as a workflow artifact itself.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

  site:
    name: Build companion dapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # These jobs run third-party build and test code; the job token has
          # nothing to do after checkout and must not linger in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build connector (site dependency)
        run: yarn workspace stellar-soroban-snap-connector build

      - name: Build site
        # CI verifies the site builds; it does not produce a deployed
        # artifact. ALLOW_LOCAL_SNAP opts out of the production guard that
        # requires the audited npm: GATSBY_SNAP_ORIGIN (gatsby-node.js onPreBuild).
        # Remove once the audited release is published and
        # .env.production carries the pinned npm: origin.
        #
        # `gatsby build` always forces NODE_ENV=production, and gatsby-node.js
        # refuses ALLOW_LOCAL_SNAP outright when the configuration environment
        # (GATSBY_ACTIVE_ENV, falling back to NODE_ENV) is production, so that
        # a release build can never be quietly pointed at a local snap.
        # GATSBY_ACTIVE_ENV=development is what tells it this is a development
        # configuration being built, which is the only setting under which the
        # local-snap override is honoured. The job below builds the release
        # configuration with neither variable set.
        run: yarn workspace site build
        env:
          ALLOW_LOCAL_SNAP: 'true'
          GATSBY_ACTIVE_ENV: development

  release-site:
    name: Build companion dapp in release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # These jobs run third-party build and test code; the job token has
          # nothing to do after checkout and must not linger in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build connector (site dependency)
        run: yarn workspace stellar-soroban-snap-connector build

      # The job above builds with the release guard disabled, so it never
      # exercises the configuration users will actually install. This one
      # builds the way a release does: the exact audited npm snap ID and an
      # exact version, no local override. gatsby-node.js then verifies both
      # the configuration (onPreBuild) and the emitted JavaScript
      # (onPostBuild), so a build that silently fell back to the development
      # snap fails here rather than at submission.
      - name: Write release environment
        run: |
          SNAP_NAME=$(node -p "require('./packages/snap/package.json').name")
          SNAP_VERSION=$(node -p "require('./packages/snap/package.json').version")
          printf 'GATSBY_SNAP_ORIGIN=npm:%s\nGATSBY_SNAP_VERSION=%s\n' \
            "$SNAP_NAME" "$SNAP_VERSION" > packages/site/.env.production
          cat packages/site/.env.production

      - name: Build site (release configuration)
        run: yarn workspace site build

      - name: Verify the emitted bundle requests the audited snap
        run: |
          SNAP_NAME=$(node -p "require('./packages/snap/package.json').name")
          SNAP_VERSION=$(node -p "require('./packages/snap/package.json').version")
          if ! grep -rq "npm:$SNAP_NAME" packages/site/public/*.js; then
            echo "Emitted bundle does not reference npm:$SNAP_NAME"; exit 1
          fi
          if grep -rq "local:http://localhost:8080\"" packages/site/public/*.js; then
            echo "Note: the localhost literal is present as the unused fallback arm."
          fi
          echo "Release bundle requests npm:$SNAP_NAME @ $SNAP_VERSION"
