name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (eslint + prettier)
        run: yarn lint

      # The release version lives in four files, one of them a hardcoded
      # constant that pins which snap version dapps install. A bump that
      # misses one is silent and version-pinned allowlisting would ship it.
      - name: Verify release versions agree
        run: yarn check:versions

      - name: Build snap (includes SES eval)
        run: yarn workspace stellar-soroban-snap build

      - name: Verify committed manifest matches the built bundle
        run: git diff --exit-code packages/snap/snap.manifest.json

      # The threat model claims the shipped bundle contains zero Math.random
      # references (snap.config.ts rewrites them to crypto.getRandomValues).
      # Enforce the claim so a dependency bump reintroducing insecure
      # randomness in a form the rewrite misses fails the build.
      - name: Verify bundle contains no insecure randomness
        run: "! grep -qE 'Math\\.random|Math\\[.random' packages/snap/dist/bundle.js"

      # Direct runtime dependencies must stay advisory-free. The transitive
      # graph is analyzed separately (docs/THREAT-MODEL.md §5): advisories
      # there are checked against the built bundle, not gated here.
      - name: Audit snap runtime dependencies
        run: yarn workspace stellar-soroban-snap npm audit --environment production

      - name: Build connector
        run: yarn workspace stellar-soroban-snap-connector build

      # Run with coverage so the per-module thresholds in jest.config.js gate
      # the build. They exist because the fail-closed signing guards are each
      # a single `if` whose deletion is invisible in review; the threshold on
      # handlers/sign.tsx is what turns that into a failing test.
      - name: Snap tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap test:coverage

      - name: Connector tests
        run: yarn workspace stellar-soroban-snap-connector test

  site:
    name: Build companion dapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build connector (site dependency)
        run: yarn workspace stellar-soroban-snap-connector build

      - name: Build site
        # CI verifies the site builds; it does not produce a deployed
        # artifact. ALLOW_LOCAL_SNAP opts out of the production guard that
        # requires the audited npm: GATSBY_SNAP_ORIGIN (gatsby-node.js onPreBuild).
        # Remove once the audited release is published and
        # .env.production carries the pinned npm: origin.
        run: yarn workspace site build
        env:
          ALLOW_LOCAL_SNAP: 'true'

  release-site:
    name: Build companion dapp in release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build connector (site dependency)
        run: yarn workspace stellar-soroban-snap-connector build

      # The job above builds with the release guard disabled, so it never
      # exercises the configuration users will actually install. This one
      # builds the way a release does: the exact audited npm snap ID and an
      # exact version, no local override. gatsby-node.js then verifies both
      # the configuration (onPreBuild) and the emitted JavaScript
      # (onPostBuild), so a build that silently fell back to the development
      # snap fails here rather than at submission.
      - name: Write release environment
        run: |
          SNAP_NAME=$(node -p "require('./packages/snap/package.json').name")
          SNAP_VERSION=$(node -p "require('./packages/snap/package.json').version")
          printf 'GATSBY_SNAP_ORIGIN=npm:%s\nGATSBY_SNAP_VERSION=%s\n' \
            "$SNAP_NAME" "$SNAP_VERSION" > packages/site/.env.production
          cat packages/site/.env.production

      - name: Build site (release configuration)
        run: yarn workspace site build

      - name: Verify the emitted bundle requests the audited snap
        run: |
          SNAP_NAME=$(node -p "require('./packages/snap/package.json').name")
          SNAP_VERSION=$(node -p "require('./packages/snap/package.json').version")
          if ! grep -rq "npm:$SNAP_NAME" packages/site/public/*.js; then
            echo "Emitted bundle does not reference npm:$SNAP_NAME"; exit 1
          fi
          if grep -rq "local:http://localhost:8080\"" packages/site/public/*.js; then
            echo "Note: the localhost literal is present as the unused fallback arm."
          fi
          echo "Release bundle requests npm:$SNAP_NAME @ $SNAP_VERSION"
