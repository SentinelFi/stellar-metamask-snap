name: Release

# Publishing happens here and only here.
#
# The reason is npm provenance. Both packages set `publishConfig.provenance`,
# which produces a signed attestation binding the published tarball to the
# workflow run and commit that built it. That attestation can only be minted
# by a supported CI environment holding an OIDC token, so a publish from a
# laptop cannot produce one.
#
# It is worth being precise about why this workflow uses `npm publish` rather
# than `yarn npm publish`, because the repository otherwise pins Yarn 3 for
# everything. Yarn 3 does not implement provenance at all (the string does not
# appear anywhere in .yarn/releases/yarn-3.2.1.cjs), and it does not run the
# `prepublishOnly` lifecycle script either. Publishing the snap through Yarn
# would therefore skip BOTH the attestation and `mm-snap manifest`, silently,
# with a successful exit code. The npm CLI runs both.
#
# The workflow is two jobs, and the split is the point:
#
#   build    Runs every gate (lint, versions, build, manifest seal, audits,
#            typecheck, tests with coverage thresholds, SBOM), then packs both
#            tarballs and records their SHA-256 digests as job outputs. It
#            holds no secret and no OIDC token. Everything that executes
#            third-party code (eslint, jest, ts-jest, the SBOM action, every
#            dev dependency) executes here, in a job that cannot publish.
#
#   publish  Holds the OIDC token and runs inside the `npm-publish`
#            environment. It never checks out the repository and never runs a
#            build tool: it downloads the tarballs the build job uploaded,
#            refuses them unless their digests equal the ones the build job
#            recorded, and runs `npm publish <tarball> --provenance`. Job
#            outputs are stored by GitHub, not by the artifact store, so a
#            step that could rewrite the artifact cannot also rewrite the
#            digest it is checked against.
#
# Before the split, the manifest-seal check ran in the middle of one job and
# test, lint, and SBOM tooling ran after it with the publish token in reach;
# a compromised dev dependency could have substituted the artifact together
# with a self-consistent manifest and nothing would have re-checked. Now the
# seal is re-verified immediately before packing (after the last step that
# rebuilds anything: `test:coverage` rebuilds the bundle, and `mm-snap build`
# rewrites the manifest), the tarball's contents are compared to the committed
# files, and what the publish job publishes is exactly that tarball.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every gate and pack the tarballs, but do not publish'
        type: boolean
        default: true
      bootstrap-token:
        description: >-
          First publish of a package only: authenticate the publish step with
          the NPM_BOOTSTRAP_TOKEN secret instead of trusted publishing. See
          docs/RELEASE.md before enabling.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `id-token`, no environment, no secrets: this job can prove things
    # about the artifact but cannot publish it.
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.toolchain.outputs.node-version }}
      snap-tarball: ${{ steps.pack.outputs.snap-tarball }}
      snap-sha256: ${{ steps.pack.outputs.snap-sha256 }}
      connector-tarball: ${{ steps.pack.outputs.connector-tarball }}
      connector-sha256: ${{ steps.pack.outputs.connector-sha256 }}
    steps:
      # A real publish must come from a release tag, whichever event started
      # the run. Pushing a tag satisfies this by construction; a manual run
      # can be started from any branch, and with dry-run disabled it would
      # otherwise publish an untagged commit that no release identifies. The
      # tag-equals-version check further down only runs on tag refs, so this
      # is the step that makes that check unconditional for real publishes.
      - name: Refuse a real publish from anything but a release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::A real publish (dry-run disabled) may only be started from a refs/tags/v* ref; this run is on ${GITHUB_REF}. Start the workflow from the release tag, or leave dry-run enabled."
          exit 1

      - name: Checkout the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Everything below this point runs code from the dependency graph with
      # write access to the checkout, including its `.git` directory. Local
      # `HEAD`, local refs, and even the object database can be rewritten from
      # inside the job; `GITHUB_SHA` cannot, because the runner is told it by
      # the event that started the run. So the release baseline is fixed to
      # `GITHUB_SHA` here, before any of that code has run, and recorded as
      # content hashes in a step output that no later step can rewrite.
      #
      # Recording hashes rather than paths is what makes the later comparison
      # independent of the repository: `git hash-object` recomputes a blob ID
      # from bytes, so verifying a packed file against one of these IDs asks
      # nothing of the object database, the refs, or `HEAD` at the time of the
      # check. A commit created inside the job cannot launder a modified file
      # past it.
      - name: Record the immutable release baseline
        id: baseline
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checkout HEAD $(git rev-parse HEAD) is not the triggering commit $GITHUB_SHA"
            exit 1
          fi
          if [ -n "$(git replace --list)" ]; then
            echo "Replacement refs are configured; object reads cannot be trusted"
            exit 1
          fi
          {
            echo "blobs<<BASELINE_EOF"
            for FILE in \
              packages/snap/package.json \
              packages/snap/README.md \
              packages/snap/LICENSE \
              packages/snap/snap.manifest.json \
              packages/snap/images/icon.svg \
              packages/connector/package.json \
              packages/connector/README.md \
              packages/connector/LICENSE
            do
              echo "$FILE $(git --no-replace-objects rev-parse "$GITHUB_SHA:$FILE")"
            done
            echo "BASELINE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release baseline pinned to $GITHUB_SHA"

      # The publish job installs the same Node without a checkout, so the
      # pinned version is handed over as an output rather than read twice.
      - name: Read the pinned Node.js version
        id: toolchain
        run: echo "node-version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # The release gates are the CI gates. They are repeated here rather than
      # assumed from a green CI run on the same commit, because what gets
      # published is this checkout, and a release must not depend on someone
      # having noticed that some other run was green.
      - name: Lint
        run: yarn lint

      - name: Verify release versions agree
        run: yarn check:versions

      - name: Build snap
        run: yarn workspace stellar-soroban-snap build

      - name: Verify committed manifest matches the built bundle
        run: git diff --exit-code packages/snap/snap.manifest.json

      - name: Verify bundle contains no insecure randomness
        run: |
          BUNDLE=packages/snap/dist/bundle.js
          ! grep -qE 'Math\.random|Math\[.random' "$BUNDLE"

      - name: Audit direct runtime dependencies (all workspaces)
        run: yarn npm audit --all --environment production

      # The snap's exact, lockfile-resolved production graph, audited per
      # version against the registry. See the fuller rationale on the same
      # step in ci.yml.
      - name: Audit the snap's exact production graph
        run: node scripts/check-snap-graph-advisories.mjs

      # The allowlist gate over Yarn's own audit of the snap's transitive
      # production graph, including re-verification that every package the
      # allowlist calls absent really is absent from the bundle about to be
      # published. See the fuller rationale on the same step in ci.yml.
      - name: Gate transitive production advisories against the allowlist
        run: |
          ( cd packages/snap && \
            yarn npm audit --environment production --recursive --json ) \
            > "$RUNNER_TEMP/audit.json" || true
          node scripts/check-known-advisories.mjs "$RUNNER_TEMP/audit.json"

      - name: Build connector
        run: yarn workspace stellar-soroban-snap-connector build

      # The connector publishes only `dist/`, and `dist/` is gitignored, so
      # neither the cleanliness check below nor the snap tarball comparison
      # sees it. Its seal is this digest, taken now, before any further step
      # (typecheck, tests, SBOM) executes third-party code with write access
      # to the checkout, and re-checked immediately before packing: a tool
      # that alters the connector's build output after this point fails the
      # release instead of being packed and published.
      - name: Record the connector build-output digest
        id: connector-build
        run: |
          DIST_SHA256="$( ( cd packages/connector && find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) | sha256sum | cut -d' ' -f1 )"
          echo "dist-sha256=$DIST_SHA256" >> "$GITHUB_OUTPUT"
          echo "connector dist digest: $DIST_SHA256"

      # After the connector build: the site resolves connector types from
      # `dist/`. See the fuller note on the same step in ci.yml.
      - name: Typecheck (all workspaces)
        run: yarn typecheck

      - name: Snap tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap test:coverage

      # The snap's `dist/` is gitignored build output, so no committed
      # baseline can pin it. Its seal is this digest, taken after the last
      # step that rebuilds the bundle (`test:coverage` above runs the build)
      # and before the SBOM action and anything else executes third-party
      # code with write access. It is re-checked immediately before packing,
      # so a tool that alters the bundle after this point fails the release
      # rather than being packed and published.
      - name: Record the snap build-output digest
        id: snap-build
        run: |
          set -euo pipefail
          DIST_SHA256="$( ( cd packages/snap && find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) | sha256sum | cut -d' ' -f1 )"
          echo "dist-sha256=$DIST_SHA256" >> "$GITHUB_OUTPUT"
          echo "snap dist digest: $DIST_SHA256"

      - name: Connector tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap-connector test:coverage

      - name: Site tests
        run: yarn workspace site test

      # The tag must name the version being published. A tag pointing at a
      # commit whose package.json says something else would publish a version
      # that no tag identifies, which is exactly the drift the release
      # procedure's "publish only from the annotated tag" rule exists to stop.
      #
      # The same rule has two more halves this job enforces itself rather
      # than leaving to repository settings: the tag must be an annotated tag
      # (a lightweight tag carries no tagger, message, or signature and is
      # not what the procedure creates), and the commit it names must already
      # be on the protected default branch. Without the ancestry check anyone
      # with tag-push rights could run the whole build against a commit that
      # never passed review, and the publish would then wait only on whatever
      # environment gate exists outside the repository.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/snap/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "Tag $GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          # Fetched from the repository's URL rather than from the `origin`
          # remote: a remote name is read out of local Git configuration,
          # which earlier steps could have rewritten to point somewhere that
          # answers this question the way an attacker prefers.
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --no-tags --depth=1 "$REPO_URL" main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            # The shallow fetch above only sees the tip; deepen until the
            # relationship is decidable rather than assuming either answer.
            git fetch --no-tags --unshallow "$REPO_URL" main || git fetch --no-tags "$REPO_URL" main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
              exit 1
            fi
          fi
          echo "Releasing $PKG_VERSION from annotated tag $GITHUB_REF_NAME on main"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      # The seal, and the order inside it is the point. `mm-snap manifest`
      # runs *first*, because it is the last dependency-controlled command
      # this job executes and the assertions after it are what establish that
      # nothing it did left a mark. (It validates and fails rather than
      # rewriting, which is why it is safe to run at all; the checks below no
      # longer take that on trust.) Everything after this step must be free of
      # dependency-controlled code, which is why the pack runs with lifecycle
      # scripts disabled.
      #
      # `test:coverage` rebuilt the bundle, `mm-snap build` rewrites the
      # manifest on every build, and every step since the first manifest check
      # executed third-party code with write access. So the seal re-establishes
      # three things about the files that will actually be packed: the
      # checkout is still the commit this run was triggered for, nothing
      # tracked or untracked under either package has changed, and every file
      # a tarball will carry still hashes to the blob recorded from
      # `GITHUB_SHA` before any of that code ran.
      - name: Re-verify the release seal against the files to be packed
        env:
          BASELINE_BLOBS: ${{ steps.baseline.outputs.blobs }}
        run: |
          set -euo pipefail
          yarn workspace stellar-soroban-snap exec mm-snap manifest

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checkout HEAD moved to $(git rev-parse HEAD); the release commit is $GITHUB_SHA"
            exit 1
          fi
          if [ -n "$(git replace --list)" ]; then
            echo "Replacement refs appeared during the build"
            exit 1
          fi
          git diff --exit-code -- packages/snap packages/connector
          if [ -n "$(git status --porcelain -- packages/snap packages/connector)" ]; then
            echo "Tracked or untracked changes under the packages after the gates ran:"
            git status --porcelain -- packages/snap packages/connector
            exit 1
          fi
          while IFS=' ' read -r FILE OID; do
            [ -n "$FILE" ] || continue
            ACTUAL="$(git hash-object "$FILE")"
            if [ "$ACTUAL" != "$OID" ]; then
              echo "$FILE is not the file committed at $GITHUB_SHA"
              exit 1
            fi
          done <<< "$BASELINE_BLOBS"
          echo "Seal holds: the working tree still matches $GITHUB_SHA."�

      # Pack both tarballs and verify each one completely against inputs that
      # were fixed before any dependency-controlled code ran: an exact file
      # inventory, entry types, the committed bytes of every static file, and
      # the recorded digest of the build output.
      #
      # "Completely" is the word that matters. Checking a few important files
      # leaves the rest of the archive unverified, and an archive is published
      # whole: `package.json` decides what npm consumers execute and install,
      # and a file nobody compared is a file anybody could have added. So the
      # inventory is an allowlist, not a spot check, and every entry in it is
      # accounted for by something immutable.
      #
      # The snap manifest's shasum is deliberately not recomputed here. It is
      # not a hash of the bundle file; it is MetaMask's own checksum over a
      # canonical form, and reimplementing it in shell would be a second,
      # weaker implementation of the thing being checked. The chain used
      # instead is: the packed manifest is byte-identical to the committed
      # one, `mm-snap manifest` has just confirmed that manifest against the
      # bundle on disk, and the packed bundle is byte-identical to that
      # bundle.
      #
      # Lifecycle scripts are disabled for the pack. `prepack` runs
      # scripts/check-publish-env.mjs, which refuses to pack where no
      # provenance attestation is possible; this job cannot attest, by design,
      # since it holds no OIDC token. Skipping the script is better than
      # setting its escape hatch: nothing dependency-controlled then runs
      # after the seal, and the question it asks is answered where it belongs,
      # by npm itself in the publish job, which refuses `--provenance`
      # without the token.
      - name: Pack and record tarball digests
        id: pack
        env:
          BASELINE_BLOBS: ${{ steps.baseline.outputs.blobs }}
          SNAP_DIST_SHA256: ${{ steps.snap-build.outputs.dist-sha256 }}
          CONNECTOR_DIST_SHA256: ${{ steps.connector-build.outputs.dist-sha256 }}
        run: |
          set -euo pipefail

          tarball_name() {
            node -p "const p = require('./packages/$1/package.json'); p.name.replace(/^@/u, '').replace('/', '-') + '-' + p.version + '.tgz'"
          }
          SNAP_TGZ="$(tarball_name snap)"
          CONNECTOR_TGZ="$(tarball_name connector)"

          npm pack --ignore-scripts --workspace packages/snap --pack-destination .
          npm pack --ignore-scripts --workspace packages/connector --pack-destination .
          test -f "$SNAP_TGZ" && test -f "$CONNECTOR_TGZ"

          # Verifies one archive against the immutable baseline. `$1` is the
          # tarball, `$2` the package directory name, `$3` a file listing the
          # exact paths the archive may contain, `$4` the recorded digest of
          # that package's build output.
          verify_archive() {
            local TGZ="$1" PKG="$2" EXPECTED="$3" DIST_SHA="$4"
            local EXTRACT="$RUNNER_TEMP/$PKG-package"
            local BAD REL ACTUAL DIST_NOW FILE OID

            # Only regular files and directories. A symlink, hard link, or
            # device node is never something this build produced, and each is
            # a way to make an extracted tree differ from its listing.
            BAD="$(tar -tvzf "$TGZ" | awk '{ t = substr($1, 1, 1); if (t != "-" && t != "d") print }')"
            if [ -n "$BAD" ]; then
              echo "Unexpected entry types in $TGZ:"
              echo "$BAD"
              exit 1
            fi

            # Exact inventory: nothing missing, nothing extra.
            tar -tzf "$TGZ" | grep -v '/$' | sed 's|^package/||' \
              | LC_ALL=C sort > "$RUNNER_TEMP/$PKG.packed"
            diff -u "$EXPECTED" "$RUNNER_TEMP/$PKG.packed"

            rm -rf "$EXTRACT"
            mkdir -p "$EXTRACT"
            tar -xzf "$TGZ" -C "$EXTRACT"

            # Static files: byte-identical to the release commit, compared by
            # recomputed content hash so the check asks nothing of the local
            # repository.
            while IFS=' ' read -r FILE OID; do
              [ -n "$FILE" ] || continue
              case "$FILE" in
                "packages/$PKG/"*) REL="${FILE#packages/$PKG/}" ;;
                *) continue ;;
              esac
              ACTUAL="$(git hash-object "$EXTRACT/package/$REL")"
              if [ "$ACTUAL" != "$OID" ]; then
                echo "$TGZ carries a $REL that is not the file committed at $GITHUB_SHA"
                exit 1
              fi
            done <<< "$BASELINE_BLOBS"

            # Build output: still the tree whose digest was recorded before
            # the later steps ran, and packed from it byte for byte.
            test -n "$DIST_SHA"
            DIST_NOW="$( ( cd "packages/$PKG" && find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) | sha256sum | cut -d' ' -f1 )"
            if [ "$DIST_NOW" != "$DIST_SHA" ]; then
              echo "packages/$PKG/dist changed after its verified build (recorded $DIST_SHA, found $DIST_NOW)"
              exit 1
            fi
            ( cd "packages/$PKG" && find dist -type f | LC_ALL=C sort ) > "$RUNNER_TEMP/$PKG.dist.built"
            # An empty file list would make every comparison below pass
            # vacuously; a package with no build output is not sealable.
            test -s "$RUNNER_TEMP/$PKG.dist.built"
            while IFS= read -r FILE; do
              cmp "packages/$PKG/$FILE" "$EXTRACT/package/$FILE"
            done < "$RUNNER_TEMP/$PKG.dist.built"

            echo "$TGZ matches the committed files and the verified build output."
          }

          # The snap publishes exactly one bundle: `files` lists `dist/`, and
          # the build emits `dist/bundle.js` and nothing else. Spelling the
          # inventory out means an extra emitted file fails the release rather
          # than riding along unexamined.
          cat > "$RUNNER_TEMP/snap.expected" <<'SNAP_FILES'
          LICENSE
          README.md
          dist/bundle.js
          images/icon.svg
          package.json
          snap.manifest.json
          SNAP_FILES
          LC_ALL=C sort -o "$RUNNER_TEMP/snap.expected" "$RUNNER_TEMP/snap.expected"
          verify_archive "$SNAP_TGZ" snap "$RUNNER_TEMP/snap.expected" "$SNAP_DIST_SHA256"

          # The connector's `dist/` is a compiled tree of many files, so its
          # inventory is the built tree itself, which the digest above pins.
          {
            printf '%s\n' LICENSE README.md package.json
            ( cd packages/connector && find dist -type f )
          } | LC_ALL=C sort > "$RUNNER_TEMP/connector.expected"
          verify_archive "$CONNECTOR_TGZ" connector "$RUNNER_TEMP/connector.expected" "$CONNECTOR_DIST_SHA256"

          SNAP_SHA256="$(sha256sum "$SNAP_TGZ" | cut -d' ' -f1)"
          CONNECTOR_SHA256="$(sha256sum "$CONNECTOR_TGZ" | cut -d' ' -f1)"
          {
            echo "snap-tarball=$SNAP_TGZ"
            echo "snap-sha256=$SNAP_SHA256"
            echo "connector-tarball=$CONNECTOR_TGZ"
            echo "connector-sha256=$CONNECTOR_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "$SNAP_SHA256  $SNAP_TGZ"
          echo "$CONNECTOR_SHA256  $CONNECTOR_TGZ"
          tar -tzf "$SNAP_TGZ"
          tar -tzf "$CONNECTOR_TGZ"

      - name: Upload the packed tarballs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-tarballs
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 30

      - name: Dry run complete
        if: inputs.dry-run
        run: |
          echo "Dry run: every gate passed and both tarballs were packed; nothing was published."

  publish:
    name: Publish
    needs: build
    # Never on a dry run, and never from anything but a release tag: the
    # build job already fails a manual non-tag run with dry-run disabled, and
    # this condition states the same rule where the token lives.
    if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules on this environment (required reviewers) are the human
    # gate on a publish; they are configured in the repository settings, not
    # here. See docs/RELEASE.md.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance and for npm trusted publishing: the OIDC
      # token both signs the attestation and authenticates the publish, so no
      # long-lived npm token exists anywhere in this workflow. This is the
      # only job that holds it, and it runs nothing but npm.
      id-token: write
    steps:
      # No checkout: the job publishes the tarballs the build job produced
      # and has no use for the source tree. Node comes from the build job's
      # reading of .nvmrc so both jobs run the same pinned version.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}

      # Trusted publishing (OIDC authentication to npm) needs npm 11.5.1 or
      # later, and Node 22 ships npm 10. The version is pinned rather than
      # `latest` so the one tool this job runs is the one that was reviewed;
      # bump it deliberately, together with the integrity below. The check
      # after the install is what fails the job if the pin ever drops below
      # the trusted-publishing floor.
      #
      # The tarball is verified before it is installed. This is the one job
      # that holds the OIDC identity and mints the provenance attestation,
      # and every other third-party input it takes is pinned by digest
      # (actions by commit, the packed artifacts by SHA-256). An npm fetched
      # by version alone would be the exception: a registry-side substitution
      # of that one tarball would run inside the publishing identity. The
      # expected value is `npm view npm@<version> dist.integrity`, recorded
      # here at review time; `npm pack` writes the tarball without running
      # anything from it, and the comparison gates the install.
      - name: Install an npm with trusted publishing support
        env:
          NPM_VERSION: 11.19.0
          NPM_INTEGRITY: sha512-SDd/hHg3KqHE5Ht2NHWxNYNtqCQ2pXAPLl6OtQhPyED5PHsRfrOtO199MZTIG2cQoQ1ZRI9t28shrD+2cr3AAw==
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-tool"
          cd "$RUNNER_TEMP/npm-tool"
          TARBALL=$(npm pack "npm@${NPM_VERSION}" --silent)
          ACTUAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          if [ "$ACTUAL" != "$NPM_INTEGRITY" ]; then
            echo "npm@${NPM_VERSION} tarball integrity mismatch:"
            echo "  expected $NPM_INTEGRITY"
            echo "  actual   $ACTUAL"
            exit 1
          fi
          npm install -g "./$TARBALL"
          cd "$GITHUB_WORKSPACE"
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " predates trusted publishing (needs >= 11.5.1)"); process.exit(1); }
          ' "$(npm --version)"

      - name: Download the packed tarballs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-tarballs
          path: tarballs

      # The artifact store is writable by anything in this run that holds the
      # runtime token; the job outputs are not. Refuse to publish anything
      # whose digest is not the one the build job recorded, and refuse extra
      # files in the artifact outright.
      - name: Verify the tarballs are the ones the build job packed
        env:
          SNAP_TGZ: ${{ needs.build.outputs.snap-tarball }}
          SNAP_SHA256: ${{ needs.build.outputs.snap-sha256 }}
          CONNECTOR_TGZ: ${{ needs.build.outputs.connector-tarball }}
          CONNECTOR_SHA256: ${{ needs.build.outputs.connector-sha256 }}
        working-directory: tarballs
        run: |
          test -n "$SNAP_TGZ" && test -n "$SNAP_SHA256"
          test -n "$CONNECTOR_TGZ" && test -n "$CONNECTOR_SHA256"
          EXTRA="$(ls -A | grep -vxF -e "$SNAP_TGZ" -e "$CONNECTOR_TGZ" || true)"
          if [ -n "$EXTRA" ]; then
            echo "Unexpected files in the release-tarballs artifact:"
            echo "$EXTRA"
            exit 1
          fi
          printf '%s  %s\n%s  %s\n' \
            "$SNAP_SHA256" "$SNAP_TGZ" "$CONNECTOR_SHA256" "$CONNECTOR_TGZ" \
            | sha256sum --check --strict
          echo "Publishing $SNAP_TGZ ($SNAP_SHA256) and $CONNECTOR_TGZ ($CONNECTOR_SHA256)"

      # Bootstrap path only. npm's trusted publisher configuration lives in
      # the settings of a package that already exists on the registry, so the
      # very first publish of a package cannot use it. For that one run, and
      # only when the `bootstrap-token` input was enabled on a manual run from
      # the release tag, the publish steps authenticate with the
      # NPM_BOOTSTRAP_TOKEN secret. The token is referenced from ~/.npmrc by
      # environment variable and exposed only to the two publish steps. Delete
      # the secret once the trusted publisher is configured; see
      # docs/RELEASE.md.
      - name: Configure token authentication (bootstrap only)
        if: ${{ inputs.bootstrap-token }}
        run: |
          echo "::warning::Publishing with the bootstrap token instead of trusted publishing. Configure the trusted publisher on npmjs.com and delete NPM_BOOTSTRAP_TOKEN after this run."
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc

      # Snap first: the connector pins the snap version it installs, so a
      # connector on npm naming a snap release that does not exist yet is a
      # window in which a dapp can install a broken pair.
      #
      # Publishing a tarball runs no lifecycle scripts (no `prepack`, no
      # `prepublishOnly`): everything those scripts checked was checked in the
      # build job, against the exact bytes in these files. `--provenance`
      # makes npm refuse to publish without an OIDC token, so a run that
      # somehow reached here without one stops rather than publishing an
      # unattested artifact.
      - name: Publish snap
        env:
          SNAP_TGZ: ${{ needs.build.outputs.snap-tarball }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap-token && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "tarballs/$SNAP_TGZ" --provenance --access public

      - name: Publish connector
        env:
          CONNECTOR_TGZ: ${{ needs.build.outputs.connector-tarball }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap-token && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "tarballs/$CONNECTOR_TGZ" --provenance --access public
