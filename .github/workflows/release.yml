name: Release

# Publishing happens here and only here.
#
# The reason is npm provenance. Both packages set `publishConfig.provenance`,
# which produces a signed attestation binding the published tarball to the
# workflow run and commit that built it. That attestation can only be minted
# by a supported CI environment holding an OIDC token, so a publish from a
# laptop cannot produce one.
#
# It is worth being precise about why this workflow uses `npm publish` rather
# than `yarn npm publish`, because the repository otherwise pins Yarn 3 for
# everything. Yarn 3 does not implement provenance at all (the string does not
# appear anywhere in .yarn/releases/yarn-3.2.1.cjs): it would publish an
# unattested tarball, silently, with a successful exit code, while the npm CLI
# refuses to publish with `--provenance` and no OIDC token. Note that
# publishing a tarball runs no lifecycle scripts under either CLI (no
# `prepack`, no `prepublishOnly`); `mm-snap manifest` runs and is checked in
# the build job, and the sealed archives are published byte-for-byte as
# verified.
#
# The workflow is three jobs, and the split is the point:
#
#   build    Runs every gate (lint, versions, build, manifest and build-output
#            seals, audits, typecheck, tests with coverage thresholds, SBOM)
#            and uploads the two build-output trees. It holds no secret and no
#            OIDC token. Everything that executes third-party code (eslint,
#            jest, ts-jest, mm-snap, the SBOM action, every dev dependency)
#            executes here, in a job that can neither publish nor vouch for
#            what it produced.
#
#   seal     Packs both tarballs and verifies them completely, in a job that
#            has never run this repository's dependency graph: it checks out
#            the release commit, downloads the build output, and compares it
#            against digests that were committed and reviewed before any
#            compiler ran. It uses no tool from the repository, only the
#            runner's own git, npm, tar, and coreutils.
#
#   publish  Holds the OIDC token and runs inside the `npm-publish`
#            environment. It never checks out the repository and never runs a
#            build tool: it downloads the tarballs the seal job uploaded,
#            refuses them unless their digests equal the ones that job
#            recorded, and runs `npm publish <tarball> --provenance`. Job
#            outputs are stored by GitHub, not by the artifact store, so a
#            step that could rewrite the artifact cannot also rewrite the
#            digest it is checked against. Publication is serialized across
#            all releases (a fixed concurrency group), refuses to move npm's
#            `latest` backward, skips a version already on the registry with
#            exactly the sealed bytes (so a partial release is resumed by
#            re-running), and finishes by verifying that the registry serves
#            the sealed pair with `latest` resolving to it.
#
# Why the seal is a separate job rather than later steps of the build job.
# Steps within a job share more than a working directory. `GITHUB_PATH` and
# `GITHUB_ENV` are environment files whose contents apply to every later step,
# so code running anywhere in the build job can put its own `git`, `tar`, or
# `sha256sum` earlier on the PATH, or set a shell hook such as `BASH_ENV` that
# a later non-interactive shell sources before it runs anything. Verification
# performed after that point is verification the attacker configured: it can
# be made to pass over a substituted archive and then emit that archive's
# genuine digest for the publish job to honour. Recording an immutable Git
# baseline does not help, because the same process controls the commands that
# compare against it.
#
# Those environment files are scoped to one job. A separate job is a separate
# runner with a fresh environment, so nothing the build job's dependencies did
# reaches the seal job, and the seal job installs nothing from this repository
# for them to have influenced. That is why it can afford to trust the tools it
# invokes by name.
#
# What the seal job compares against is committed, not produced. Each package
# carries a `dist.sha256` written at build time and reviewed in the diff, and
# CI fails when a rebuild disagrees with it. A digest a build job takes of its
# own output proves only that the same bytes were later packed; it cannot say
# they are a faithful compilation of the reviewed source, because the compiler
# had already run. The committed manifest is checkable with coreutils alone,
# which is what lets the clean job verify without installing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every gate and pack the tarballs, but do not publish'
        type: boolean
        default: true
      bootstrap-token:
        description: >-
          First publish of a package only: authenticate the publish step with
          the NPM_BOOTSTRAP_TOKEN secret instead of trusted publishing. See
          docs/RELEASE.md before enabling.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `id-token`, no environment, no secrets: this job can prove things
    # about the artifact but cannot publish it.
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.toolchain.outputs.node-version }}
    steps:
      # A real publish must come from a release tag, whichever event started
      # the run. Pushing a tag satisfies this by construction; a manual run
      # can be started from any branch, and with dry-run disabled it would
      # otherwise publish an untagged commit that no release identifies. The
      # tag-equals-version check further down only runs on tag refs, so this
      # is the step that makes that check unconditional for real publishes.
      - name: Refuse a real publish from anything but a release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::A real publish (dry-run disabled) may only be started from a refs/tags/v* ref; this run is on ${GITHUB_REF}. Start the workflow from the release tag, or leave dry-run enabled."
          exit 1

      - name: Checkout the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The publish job installs the same Node without a checkout, so the
      # pinned version is handed over as an output rather than read twice.
      - name: Read the pinned Node.js version
        id: toolchain
        run: echo "node-version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # The release gates are the CI gates. They are repeated here rather than
      # assumed from a green CI run on the same commit, because what gets
      # published is this checkout, and a release must not depend on someone
      # having noticed that some other run was green.
      - name: Lint
        run: yarn lint

      - name: Verify release versions agree
        run: yarn check:versions

      - name: Build snap
        run: yarn workspace stellar-soroban-snap build

      # Two committed seals over one build output, and they answer different
      # questions. The manifest's shasum is MetaMask's own checksum over a
      # canonical form of the bundle, and is what the platform checks at
      # install time. `dist.sha256` is a plain SHA-256 of the emitted files,
      # and exists so the seal job can verify the same bytes with coreutils
      # alone, without installing this repository's tooling to check the
      # output that tooling produced.
      #
      # Both are diffed rather than recomputed-and-trusted: the developer
      # built on one operating system and committed these values, CI has just
      # rebuilt on another, and a difference means the same source produced
      # different bytes. That cross-platform agreement is the actual control.
      # A tampered toolchain on either side would have to produce exactly the
      # other side's output to pass unnoticed.
      - name: Verify committed seals match the built bundle
        run: |
          git diff --exit-code packages/snap/snap.manifest.json
          git diff --exit-code packages/snap/dist.sha256

      - name: Verify bundle contains no insecure randomness
        run: |
          BUNDLE=packages/snap/dist/bundle.js
          ! grep -qE 'Math\.random|Math\[.random' "$BUNDLE"

      - name: Audit direct runtime dependencies (all workspaces)
        run: yarn npm audit --all --environment production

      # The snap's exact, lockfile-resolved production graph, audited per
      # version against the registry. See the fuller rationale on the same
      # step in ci.yml.
      - name: Audit the snap's exact production graph
        run: node scripts/check-snap-graph-advisories.mjs

      # The allowlist gate over Yarn's own audit of the snap's transitive
      # production graph, including re-verification that every package the
      # allowlist calls absent really is absent from the bundle about to be
      # published. See the fuller rationale on the same step in ci.yml.
      - name: Gate transitive production advisories against the allowlist
        run: |
          ( cd packages/snap && \
            yarn npm audit --environment production --recursive --json ) \
            > "$RUNNER_TEMP/audit.json" || true
          node scripts/check-known-advisories.mjs "$RUNNER_TEMP/audit.json"

      - name: Build connector
        run: yarn workspace stellar-soroban-snap-connector build

      # The connector's equivalent, and until it existed the connector had no
      # pre-build anchor at all: its `dist/` is gitignored, so a digest taken
      # after the compiler ran was the only record of it, and that digest is
      # produced by the same job whose toolchain is in question. A compromised
      # compiler emitting malicious JavaScript into an expected file would
      # have been recorded, packed, and published faithfully.
      - name: Verify the committed seal matches the built connector
        run: git diff --exit-code packages/connector/dist.sha256

      # After the connector build: the site resolves connector types from
      # `dist/`. See the fuller note on the same step in ci.yml.
      - name: Typecheck (all workspaces)
        run: yarn typecheck

      - name: Snap tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap test:coverage

      - name: Connector tests (with coverage thresholds)
        run: yarn workspace stellar-soroban-snap-connector test:coverage

      - name: Site tests
        run: yarn workspace site test

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      # `test:coverage` rebuilds the snap bundle, and both builds rewrite
      # their own `dist.sha256`, so this is where a rebuild that disagrees
      # with the reviewed output stops the release. The seal job checks the
      # same thing again from its own checkout, which is the check that counts
      # if this job's tooling cannot be trusted; this one is here so an
      # ordinary non-reproducible build fails early and legibly.
      - name: Re-verify the committed seals after the gates
        run: |
          git diff --exit-code packages/snap/snap.manifest.json
          git diff --exit-code packages/snap/dist.sha256
          git diff --exit-code packages/connector/dist.sha256

      # Handed over as two artifacts with one path each, so each artifact's
      # root is the directory itself and the seal job can restore it to a
      # known location. Nothing about this transfer is trusted: the seal job
      # verifies whatever arrives against the committed digests before it
      # packs anything, so a rewritten artifact fails the release rather than
      # reaching a tarball.
      - name: Upload the snap build output
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: snap-dist
          path: packages/snap/dist
          if-no-files-found: error
          retention-days: 30

      - name: Upload the connector build output
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: connector-dist
          path: packages/connector/dist
          if-no-files-found: error
          retention-days: 30

  seal:
    name: Seal and pack
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `id-token`, no environment, no secrets, and nothing installed from
    # this repository: this job can prove things about the artifact but
    # cannot publish it, and nothing it runs came out of the dependency
    # graph it is checking.
    permissions:
      contents: read
    outputs:
      snap-tarball: ${{ steps.pack.outputs.snap-tarball }}
      snap-sha256: ${{ steps.pack.outputs.snap-sha256 }}
      connector-tarball: ${{ steps.pack.outputs.connector-tarball }}
      connector-sha256: ${{ steps.pack.outputs.connector-sha256 }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The same baseline the build job used to record, recorded here instead,
      # in the job that will actually compare against it. `GITHUB_SHA` is told
      # to the runner by the event that started the run and cannot be written
      # from inside a job; local `HEAD`, local refs, and the object database
      # can be, which is why the blob IDs are read with `--no-replace-objects`
      # and why a moved `HEAD` or any replacement ref stops the release.
      #
      # Recording content hashes rather than paths is what makes the later
      # comparison independent of the repository: `git hash-object` recomputes
      # a blob ID from bytes, so verifying a packed file against one of these
      # IDs asks nothing of the object database, the refs, or `HEAD` at the
      # time of the check.
      - name: Record the immutable release baseline
        id: baseline
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checkout HEAD $(git rev-parse HEAD) is not the triggering commit $GITHUB_SHA"
            exit 1
          fi
          if [ -n "$(git replace --list)" ]; then
            echo "Replacement refs are configured; object reads cannot be trusted"
            exit 1
          fi
          {
            echo "blobs<<BASELINE_EOF"
            for FILE in \
              packages/snap/package.json \
              packages/snap/README.md \
              packages/snap/LICENSE \
              packages/snap/snap.manifest.json \
              packages/snap/images/icon.svg \
              packages/connector/package.json \
              packages/connector/README.md \
              packages/connector/LICENSE
            do
              echo "$FILE $(git --no-replace-objects rev-parse "$GITHUB_SHA:$FILE")"
            done
            echo "BASELINE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release baseline pinned to $GITHUB_SHA"

      # Only to run `npm pack` and read a version out of a package.json.
      # Nothing from this repository is installed: `npm pack --ignore-scripts`
      # needs the workspace layout, not a node_modules tree, and every other
      # tool below (git, tar, diff, sha256sum, cmp) is the runner's own.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}

      # The tag must name the version being published. A tag pointing at a
      # commit whose package.json says something else would publish a version
      # that no tag identifies, which is exactly the drift the release
      # procedure's "publish only from the annotated tag" rule exists to stop.
      #
      # The same rule has two more halves this job enforces itself rather
      # than leaving to repository settings: the tag must be an annotated tag
      # (a lightweight tag carries no tagger, message, or signature and is
      # not what the procedure creates), and the commit it names must already
      # be on the protected default branch. Without the ancestry check anyone
      # with tag-push rights could run the whole build against a commit that
      # never passed review, and the publish would then wait only on whatever
      # environment gate exists outside the repository.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/snap/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          # Fetched from the repository's URL rather than from the `origin`
          # remote: a remote name is read out of local Git configuration,
          # which earlier steps could have rewritten to point somewhere that
          # answers this question the way an attacker prefers.
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # actions/checkout peels annotated tags: the local ref it writes
          # points at the commit, not the tag object, so asking the checkout
          # what kind of ref this is would answer "commit" for every tag,
          # annotated or not. Re-fetch the real ref before asking.
          git fetch --no-tags --depth=1 "$REPO_URL" "+$GITHUB_REF:$GITHUB_REF"
          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "Tag $GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          git fetch --no-tags --depth=1 "$REPO_URL" main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            # The shallow fetch above only sees the tip; deepen until the
            # relationship is decidable rather than assuming either answer.
            git fetch --no-tags --unshallow "$REPO_URL" main || git fetch --no-tags "$REPO_URL" main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
              exit 1
            fi
          fi
          echo "Releasing $PKG_VERSION from annotated tag $GITHUB_REF_NAME on main"

      - name: Download the snap build output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: snap-dist
          path: packages/snap/dist

      - name: Download the connector build output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: connector-dist
          path: packages/connector/dist

      # The check the whole split exists for. What arrives here is compared
      # against a digest that was committed and reviewed before any compiler
      # ran, using nothing but coreutils, in a job that has installed none of
      # the packages that produced it.
      #
      # `sha256sum -c` answers for every file the manifest lists and says
      # nothing about a file it does not, so the inventory is compared as
      # well: an extra file added to `dist/` would otherwise pass a check that
      # only ever looked at the files it already knew about.
      - name: Verify the build output against the committed digests
        run: |
          set -euo pipefail
          for PKG in snap connector; do
            (
              cd "packages/$PKG"
              awk '{ print $2 }' dist.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/$PKG.listed"
              find dist -type f | LC_ALL=C sort > "$RUNNER_TEMP/$PKG.arrived"
              if ! diff -u "$RUNNER_TEMP/$PKG.listed" "$RUNNER_TEMP/$PKG.arrived"; then
                echo "packages/$PKG/dist is not the file set dist.sha256 describes"
                exit 1
              fi
              sha256sum -c --quiet dist.sha256
              echo "packages/$PKG/dist matches the digests committed at $GITHUB_SHA"
            )
          done

      # Pack both tarballs and verify each one completely against inputs that
      # were committed and reviewed before any compiler ran: an exact file
      # inventory, entry types, the committed bytes of every static file, and
      # the committed digest of every emitted file.
      #
      # "Completely" is the word that matters. Checking a few important files
      # leaves the rest of the archive unverified, and an archive is published
      # whole: `package.json` decides what npm consumers execute and install,
      # and a file nobody compared is a file anybody could have added. So the
      # inventory is an allowlist, not a spot check, and every entry in it is
      # accounted for by something immutable.
      #
      # The snap manifest's shasum is deliberately not recomputed here. It is
      # not a hash of the bundle file; it is MetaMask's own checksum over a
      # canonical form, and reimplementing it in shell would be a second,
      # weaker implementation of the thing being checked, in the job whose
      # whole purpose is to be a trustworthy checker. The bundle is verified
      # here against `dist.sha256`, which is a plain digest of the same bytes
      # and was reviewed in the same diff; `mm-snap manifest` confirms the
      # manifest against the bundle in the build job, and the publish job
      # ships these verified archives byte-for-byte (publishing a tarball
      # runs no lifecycle scripts, so nothing re-runs there).
      #
      # Lifecycle scripts are disabled for the pack. `prepack` runs
      # scripts/check-publish-env.mjs, which refuses to pack where no
      # provenance attestation is possible; this job cannot attest, by design,
      # since it holds no OIDC token. Skipping the script is better than
      # setting its escape hatch: no repository code runs in this job at all,
      # and the question it asks is answered where it belongs, by npm itself
      # in the publish job, which refuses `--provenance` without the token.
      - name: Pack and record tarball digests
        id: pack
        env:
          BASELINE_BLOBS: ${{ steps.baseline.outputs.blobs }}
        run: |
          set -euo pipefail

          tarball_name() {
            node -p "const p = require('./packages/$1/package.json'); p.name.replace(/^@/u, '').replace('/', '-') + '-' + p.version + '.tgz'"
          }
          SNAP_TGZ="$(tarball_name snap)"
          CONNECTOR_TGZ="$(tarball_name connector)"

          npm pack --ignore-scripts --workspace packages/snap --pack-destination .
          npm pack --ignore-scripts --workspace packages/connector --pack-destination .
          test -f "$SNAP_TGZ" && test -f "$CONNECTOR_TGZ"

          # Verifies one archive against the committed baseline. `$1` is the
          # tarball, `$2` the package directory name, `$3` a file listing the
          # exact paths the archive may contain.
          verify_archive() {
            local TGZ="$1" PKG="$2" EXPECTED="$3"
            local EXTRACT="$RUNNER_TEMP/$PKG-package"
            local BAD REL ACTUAL FILE OID

            # Only regular files and directories. A symlink, hard link, or
            # device node is never something this build produced, and each is
            # a way to make an extracted tree differ from its listing.
            BAD="$(tar -tvzf "$TGZ" | awk '{ t = substr($1, 1, 1); if (t != "-" && t != "d") print }')"
            if [ -n "$BAD" ]; then
              echo "Unexpected entry types in $TGZ:"
              echo "$BAD"
              exit 1
            fi

            # Exact inventory: nothing missing, nothing extra.
            tar -tzf "$TGZ" | grep -v '/$' | sed 's|^package/||' \
              | LC_ALL=C sort > "$RUNNER_TEMP/$PKG.packed"
            diff -u "$EXPECTED" "$RUNNER_TEMP/$PKG.packed"

            rm -rf "$EXTRACT"
            mkdir -p "$EXTRACT"
            tar -xzf "$TGZ" -C "$EXTRACT"

            # Static files: byte-identical to the release commit, compared by
            # recomputed content hash so the check asks nothing of the local
            # repository.
            while IFS=' ' read -r FILE OID; do
              [ -n "$FILE" ] || continue
              case "$FILE" in
                "packages/$PKG/"*) REL="${FILE#packages/$PKG/}" ;;
                *) continue ;;
              esac
              ACTUAL="$(git hash-object "$EXTRACT/package/$REL")"
              if [ "$ACTUAL" != "$OID" ]; then
                echo "$TGZ carries a $REL that is not the file committed at $GITHUB_SHA"
                exit 1
              fi
            done <<< "$BASELINE_BLOBS"

            # Emitted files: verified inside the extracted archive against the
            # committed digests, so what is checked is what would be
            # published rather than a copy of it that happens to sit next to
            # the tarball.
            cp "packages/$PKG/dist.sha256" "$EXTRACT/package/dist.sha256"
            ( cd "$EXTRACT/package" && sha256sum -c --quiet dist.sha256 )
            rm "$EXTRACT/package/dist.sha256"

            echo "$TGZ matches the files committed at $GITHUB_SHA."
          }

          # The inventory each package may carry: the files npm always
          # includes, the extra static files each `files` entry names, and
          # every emitted file the committed digest manifest lists. Spelling
          # it out means an extra emitted file fails the release rather than
          # riding along unexamined.
          {
            printf '%s\n' LICENSE README.md package.json snap.manifest.json images/icon.svg
            awk '{ print $2 }' packages/snap/dist.sha256
          } | LC_ALL=C sort > "$RUNNER_TEMP/snap.expected"
          {
            printf '%s\n' LICENSE README.md package.json
            awk '{ print $2 }' packages/connector/dist.sha256
          } | LC_ALL=C sort > "$RUNNER_TEMP/connector.expected"

          verify_archive "$SNAP_TGZ" snap "$RUNNER_TEMP/snap.expected"
          verify_archive "$CONNECTOR_TGZ" connector "$RUNNER_TEMP/connector.expected"

          SNAP_SHA256="$(sha256sum "$SNAP_TGZ" | cut -d' ' -f1)"
          CONNECTOR_SHA256="$(sha256sum "$CONNECTOR_TGZ" | cut -d' ' -f1)"
          {
            echo "snap-tarball=$SNAP_TGZ"
            echo "snap-sha256=$SNAP_SHA256"
            echo "connector-tarball=$CONNECTOR_TGZ"
            echo "connector-sha256=$CONNECTOR_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "$SNAP_SHA256  $SNAP_TGZ"
          echo "$CONNECTOR_SHA256  $CONNECTOR_TGZ"
          tar -tzf "$SNAP_TGZ"
          tar -tzf "$CONNECTOR_TGZ"

      - name: Upload the packed tarballs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-tarballs
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 30

      - name: Dry run complete
        if: inputs.dry-run
        run: |
          echo "Dry run: every gate passed and both tarballs were packed; nothing was published."

  publish:
    name: Publish
    needs: [build, seal]
    # Never on a dry run, and never from anything but a release tag: the
    # build job already fails a manual non-tag run with dry-run disabled, the
    # seal job re-checks the tag against the version with tooling the build
    # graph cannot influence, and this condition states the same rule where
    # the token lives.
    if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/v') }}
    # One production publication at a time, whatever tag started it. GitHub
    # runs workflows for different tags concurrently, and npm assigns every
    # publish to `latest`, so a slower run for an older tag finishing after a
    # newer release would otherwise repoint fresh installs at the superseded
    # pair. The group is fixed, deliberately not keyed by tag or ref, so
    # every release queues behind the one currently publishing, and nothing
    # in progress is ever cancelled: the preflight step below is what decides
    # whether a queued release may still move the tag forward once its turn
    # comes.
    concurrency:
      group: npm-production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules on this environment (required reviewers) are the human
    # gate on a publish; they are configured in the repository settings, not
    # here. See docs/RELEASE.md.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance and for npm trusted publishing: the OIDC
      # token both signs the attestation and authenticates the publish, so no
      # long-lived npm token exists anywhere in this workflow. This is the
      # only job that holds it, and it runs nothing but npm.
      id-token: write
    steps:
      # No checkout: the job publishes the tarballs the seal job produced
      # and has no use for the source tree. Node comes from the build job's
      # reading of .nvmrc so every job runs the same pinned version.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}

      # Trusted publishing (OIDC authentication to npm) needs npm 11.5.1 or
      # later, and Node 22 ships npm 10. The version is pinned rather than
      # `latest` so the one tool this job runs is the one that was reviewed;
      # bump it deliberately, together with the integrity below. The check
      # after the install is what fails the job if the pin ever drops below
      # the trusted-publishing floor.
      #
      # The tarball is verified before it is installed. This is the one job
      # that holds the OIDC identity and mints the provenance attestation,
      # and every other third-party input it takes is pinned by digest
      # (actions by commit, the packed artifacts by SHA-256). An npm fetched
      # by version alone would be the exception: a registry-side substitution
      # of that one tarball would run inside the publishing identity. The
      # expected value is `npm view npm@<version> dist.integrity`, recorded
      # here at review time; `npm pack` writes the tarball without running
      # anything from it, and the comparison gates the install.
      - name: Install an npm with trusted publishing support
        env:
          NPM_VERSION: 11.19.0
          NPM_INTEGRITY: sha512-SDd/hHg3KqHE5Ht2NHWxNYNtqCQ2pXAPLl6OtQhPyED5PHsRfrOtO199MZTIG2cQoQ1ZRI9t28shrD+2cr3AAw==
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-tool"
          cd "$RUNNER_TEMP/npm-tool"
          TARBALL=$(npm pack "npm@${NPM_VERSION}" --silent)
          ACTUAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          if [ "$ACTUAL" != "$NPM_INTEGRITY" ]; then
            echo "npm@${NPM_VERSION} tarball integrity mismatch:"
            echo "  expected $NPM_INTEGRITY"
            echo "  actual   $ACTUAL"
            exit 1
          fi
          npm install -g "./$TARBALL"
          cd "$GITHUB_WORKSPACE"
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " predates trusted publishing (needs >= 11.5.1)"); process.exit(1); }
          ' "$(npm --version)"

      - name: Download the packed tarballs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-tarballs
          path: tarballs

      # The artifact store is writable by anything in this run that holds the
      # runtime token; the job outputs are not. Refuse to publish anything
      # whose digest is not the one the seal job recorded, and refuse extra
      # files in the artifact outright.
      - name: Verify the tarballs are the ones the seal job packed
        env:
          SNAP_TGZ: ${{ needs.seal.outputs.snap-tarball }}
          SNAP_SHA256: ${{ needs.seal.outputs.snap-sha256 }}
          CONNECTOR_TGZ: ${{ needs.seal.outputs.connector-tarball }}
          CONNECTOR_SHA256: ${{ needs.seal.outputs.connector-sha256 }}
        working-directory: tarballs
        run: |
          test -n "$SNAP_TGZ" && test -n "$SNAP_SHA256"
          test -n "$CONNECTOR_TGZ" && test -n "$CONNECTOR_SHA256"
          EXTRA="$(ls -A | grep -vxF -e "$SNAP_TGZ" -e "$CONNECTOR_TGZ" || true)"
          if [ -n "$EXTRA" ]; then
            echo "Unexpected files in the release-tarballs artifact:"
            echo "$EXTRA"
            exit 1
          fi
          printf '%s  %s\n%s  %s\n' \
            "$SNAP_SHA256" "$SNAP_TGZ" "$CONNECTOR_SHA256" "$CONNECTOR_TGZ" \
            | sha256sum --check --strict
          echo "Publishing $SNAP_TGZ ($SNAP_SHA256) and $CONNECTOR_TGZ ($CONNECTOR_SHA256)"

      # Serialization above makes releases take turns; this step is what a
      # release does when its turn comes. Two failure modes remain once only
      # one publish runs at a time. A release for an older tag can reach here
      # after a newer release has completed, and because npm assigns every
      # publish to `latest`, letting it publish would move the tag backward
      # onto the superseded pair. So the registry's current `latest` is read
      # for each package and any publish that would not move it forward is
      # refused, with versions compared as strict X.Y.Z triples (anything
      # else, on either side, fails closed rather than being guessed at). And
      # a release that published the snap but failed before the connector
      # cannot be blindly re-run, because npm versions are immutable and the
      # re-publish of the half that landed would fail before reaching the
      # half that did not. So a version that already exists is checked
      # against the sealed tarball's integrity and marked to be skipped on an
      # exact match, which makes a re-run of a partial release converge
      # instead of failing. A registry version that exists with *different*
      # bytes is not a resumable release, it is a substituted package, and
      # the release fails closed on it.
      #
      # The name and version are read from the sealed tarballs themselves
      # (this job has no checkout), so what is compared against the registry
      # is exactly what would be published.
      - name: Refuse dist-tag rollback and detect already-published versions
        id: preflight
        env:
          SNAP_TGZ: ${{ needs.seal.outputs.snap-tarball }}
          CONNECTOR_TGZ: ${{ needs.seal.outputs.connector-tarball }}
        run: |
          set -euo pipefail
          node - "tarballs/$SNAP_TGZ" "tarballs/$CONNECTOR_TGZ" <<'PREFLIGHT'
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readFileSync, appendFileSync } = require('node:fs');

          const VERSION_RE = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;

          const parseVersion = (value, label) => {
            const match = VERSION_RE.exec(value);
            if (!match) {
              console.error(`${label} is not a plain X.Y.Z version: "${value}"`);
              process.exit(1);
            }
            return match.slice(1, 4).map(Number);
          };

          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
            }
            return 0;
          };

          // Reads one field from the registry. Only a definite "not
          // published" (E404) may be treated as absence: a transient
          // registry failure must abort the release rather than make an
          // existing version look unpublished.
          const view = (spec, field) => {
            try {
              return execFileSync('npm', ['view', spec, field], {
                encoding: 'utf8',
              }).trim();
            } catch (error) {
              const output = `${error.stdout ?? ''}${error.stderr ?? ''}`;
              if (output.includes('E404')) return null;
              console.error(`npm view ${spec} ${field} failed:\n${output}`);
              process.exit(1);
            }
          };

          const integrityOf = (path) =>
            `sha512-${createHash('sha512').update(readFileSync(path)).digest('base64')}`;

          const check = (tarball, key) => {
            const manifest = JSON.parse(
              execFileSync('tar', ['-xzOf', tarball, 'package/package.json'], {
                encoding: 'utf8',
              }),
            );
            const { name, version } = manifest;
            const candidate = parseVersion(version, `${name} tarball version`);

            const latest = view(name, 'dist-tags.latest');
            if (latest !== null && latest !== '') {
              const current = parseVersion(latest, `${name} registry latest`);
              if (compare(candidate, current) < 0) {
                console.error(
                  `Refusing to publish ${name}@${version}: the registry's latest is already ${latest}, and publishing would move the latest tag backward onto an older release.`,
                );
                process.exit(1);
              }
            }

            const registryIntegrity = view(`${name}@${version}`, 'dist.integrity');
            if (registryIntegrity === null || registryIntegrity === '') {
              console.log(`${name}@${version}: not on the registry yet; publishing.`);
              appendFileSync(process.env.GITHUB_OUTPUT, `${key}=publish\n`);
              return;
            }
            const sealed = integrityOf(tarball);
            if (registryIntegrity !== sealed) {
              console.error(
                `${name}@${version} already exists on the registry with different bytes:\n  registry ${registryIntegrity}\n  sealed   ${sealed}\nThat is not a partial release to resume; treat it as package substitution and investigate before releasing.`,
              );
              process.exit(1);
            }
            if (latest === null || latest === '' || compare(parseVersion(latest, `${name} registry latest`), candidate) < 0) {
              console.error(
                `${name}@${version} is already on the registry with the sealed bytes, but the latest tag points at ${latest || 'nothing'}. This workflow cannot move dist-tags (trusted publishing authenticates npm publish only); promote the tag manually, then re-run.`,
              );
              process.exit(1);
            }
            console.log(
              `${name}@${version}: already published with the sealed bytes; skipping the publish and keeping the verification below.`,
            );
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=skip\n`);
          };

          check(process.argv[2], 'snap');
          check(process.argv[3], 'connector');
          PREFLIGHT

      # Bootstrap path only. npm's trusted publisher configuration lives in
      # the settings of a package that already exists on the registry, so the
      # very first publish of a package cannot use it. For that one run, and
      # only when the `bootstrap-token` input was enabled on a manual run from
      # the release tag, the publish steps authenticate with the
      # NPM_BOOTSTRAP_TOKEN secret. The token is referenced from ~/.npmrc by
      # environment variable and exposed only to the two publish steps. Delete
      # the secret once the trusted publisher is configured; see
      # docs/RELEASE.md.
      - name: Configure token authentication (bootstrap only)
        if: ${{ inputs.bootstrap-token }}
        run: |
          echo "::warning::Publishing with the bootstrap token instead of trusted publishing. Configure the trusted publisher on npmjs.com and delete NPM_BOOTSTRAP_TOKEN after this run."
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc

      # Snap first: the connector pins the snap version it installs, so a
      # connector on npm naming a snap release that does not exist yet is a
      # window in which a dapp can install a broken pair. Each publish is
      # skipped when the preflight found the exact sealed bytes already on
      # the registry, which is what lets a re-run of a partially published
      # release finish the half that is missing.
      #
      # Publishing a tarball runs no lifecycle scripts (no `prepack`, no
      # `prepublishOnly`): everything those scripts checked was checked in the
      # seal job, against the exact bytes in these files. `--provenance`
      # makes npm refuse to publish without an OIDC token, so a run that
      # somehow reached here without one stops rather than publishing an
      # unattested artifact.
      - name: Publish snap
        if: ${{ steps.preflight.outputs.snap != 'skip' }}
        env:
          SNAP_TGZ: ${{ needs.seal.outputs.snap-tarball }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap-token && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "tarballs/$SNAP_TGZ" --provenance --access public

      - name: Publish connector
        if: ${{ steps.preflight.outputs.connector != 'skip' }}
        env:
          CONNECTOR_TGZ: ${{ needs.seal.outputs.connector-tarball }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap-token && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "tarballs/$CONNECTOR_TGZ" --provenance --access public

      # The release is judged by what the registry now serves, not by the
      # publish commands having exited zero: consumers install from the
      # registry, so both versions must exist there with exactly the sealed
      # bytes, and `latest` must resolve to this release for both packages,
      # so the pair a fresh install receives is the pair that was sealed
      # together. A publish that half-landed fails here and the re-run
      # converges through the preflight above. Reads are retried briefly,
      # since registry views can trail a publish by a few seconds.
      #
      # This is as close to publish-then-promote as trusted publishing
      # allows: the OIDC exchange authenticates `npm publish` and nothing
      # else, so a staging dist-tag promoted to `latest` afterwards would
      # need a long-lived npm token with tag-mutation rights held in this
      # repository, reintroducing exactly the standing credential this
      # workflow exists to avoid. Ordering is protected by the serialization
      # group and the preflight's rollback refusal instead, and this step
      # proves the outcome those controls were meant to produce.
      - name: Verify the published pair
        env:
          SNAP_TGZ: ${{ needs.seal.outputs.snap-tarball }}
          CONNECTOR_TGZ: ${{ needs.seal.outputs.connector-tarball }}
        run: |
          set -euo pipefail
          node - "tarballs/$SNAP_TGZ" "tarballs/$CONNECTOR_TGZ" <<'PAIRCHECK'
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');

          const ATTEMPTS = 6;
          const RETRY_SECONDS = '5';

          const view = (spec, field) => {
            try {
              return execFileSync('npm', ['view', spec, field], {
                encoding: 'utf8',
              }).trim();
            } catch {
              return null;
            }
          };

          const verify = (tarball) => {
            const { name, version } = JSON.parse(
              execFileSync('tar', ['-xzOf', tarball, 'package/package.json'], {
                encoding: 'utf8',
              }),
            );
            const sealed = `sha512-${createHash('sha512').update(readFileSync(tarball)).digest('base64')}`;
            for (let attempt = 1; attempt <= ATTEMPTS; attempt += 1) {
              const integrity = view(`${name}@${version}`, 'dist.integrity');
              const latest = view(name, 'dist-tags.latest');
              if (integrity === sealed && latest === version) {
                console.log(`${name}@${version}: registry serves the sealed bytes and latest resolves to it.`);
                return;
              }
              console.log(
                `${name}@${version}: not settled yet (integrity ${integrity ?? 'unavailable'}, latest ${latest ?? 'unavailable'}), attempt ${attempt}/${ATTEMPTS}.`,
              );
              if (attempt < ATTEMPTS) execFileSync('sleep', [RETRY_SECONDS]);
            }
            console.error(
              `${name}@${version}: the registry does not serve the sealed release (or latest does not resolve to it). The published pair is unverified; investigate before announcing the release, and re-run this workflow to resume a partial publish.`,
            );
            process.exit(1);
          };

          verify(process.argv[2]);
          verify(process.argv[3]);
          PAIRCHECK
